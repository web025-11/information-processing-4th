    <h2>
        Apple Music独自の機能
    </h2>
      <h3>
          ハイレゾロスレス/DolbyAtomsによる高音質、空間オーディオの臨場感
      </h3>
      <h4>
          Apple Music独自のApple Lossless Audio Codec通称「ALAC」を使用しており、音質劣化なしの省データ容量で聴くことができます。<br>
          DolbyAtoms（空間オーディオ）は設定画面からONにすることができ、ドルビーアトモス技術を使った3次元的空間の音質体験を行えます。
      </h4>
